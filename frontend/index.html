<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one. Mirrors src/lib/theme.ts.
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("deja-theme");
          t = s === "light" || s === "dark" ? s : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Déjà — on-call incident copilot</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
